# Runs the whole stack: docker compose up --build   ->   http://localhost:8080
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: tradeguard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tradeguard}
      POSTGRES_DB: tradeguard
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradeguard"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://tradeguard:${POSTGRES_PASSWORD:-tradeguard}@db:5432/tradeguard
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in a .env file next to docker-compose.yml}
      CORS_ORIGINS: http://localhost:8080
      APP_URL: http://localhost:8080
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  pgdata:
