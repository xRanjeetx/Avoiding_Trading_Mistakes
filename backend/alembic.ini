# For the `alembic` command line, run from the backend folder:
#   alembic revision --autogenerate -m "add something"   (after changing a model)
#   alembic upgrade head                                  (the app also does this itself at startup)
# The database comes from DATABASE_URL / backend/.env, like the app.
[alembic]
script_location = app/migrations
prepend_sys_path = .

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
