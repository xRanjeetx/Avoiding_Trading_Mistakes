<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07110f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Trade Guard</title>
  <script>
    // Apply the saved (or system) theme before first paint to avoid a flash.
    (function () {
      var t = null;
      try { t = localStorage.getItem("atm_theme"); } catch (e) {}
      if (t !== "light" && t !== "dark") {
        t = window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      }
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    /* Splash shown while the app downloads; React replaces the contents of #root on its first render. */
    html { background: #07110f; } html[data-theme="light"] { background: #eef6f3; }
    body { margin: 0; }
    .boot { position: fixed; inset: 0; display: grid; place-items: center; align-content: center; gap: 16px; font-family: "Space Grotesk", system-ui, sans-serif; color: #e6f4ef; background: #07110f; }
    html[data-theme="light"] .boot { color: #0f2a24; background: #eef6f3; }
    .boot-logo { position: relative; width: 84px; height: 84px; display: grid; place-items: center; }
    .boot-logo img { width: 64px; height: 64px; border-radius: 16px; animation: boot-float 2.4s ease-in-out infinite, boot-glow 2.4s ease-in-out infinite; }
    .boot-logo i { position: absolute; inset: 6px; border-radius: 20px; border: 2px solid #22d3ee; opacity: 0; animation: boot-ping 2.4s ease-out infinite; }
    .boot-logo i + i { animation-delay: 1.2s; }
    .boot-logo::after { content: ""; position: absolute; inset: -4px; border-radius: 50%; border: 2px solid transparent; border-top-color: #2dd4bf; border-right-color: rgba(45, 212, 191, .35); animation: boot-spin 1.1s linear infinite; }
    .boot b { display: block; font-size: 22px; text-align: center; }
    .boot small { display: block; font-size: 13px; text-align: center; color: #22d3ee; margin-top: 2px; }
    .boot-bar { width: 200px; height: 4px; border-radius: 4px; background: rgba(148, 200, 185, .18); overflow: hidden; }
    .boot-bar span { display: block; width: 40%; height: 100%; border-radius: 4px; background: linear-gradient(90deg, #22d3ee, #2dd4bf); animation: boot-slide 1.3s ease-in-out infinite; }
    @keyframes boot-float { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-4px) scale(1.05); } }
    @keyframes boot-glow { 0%, 100% { box-shadow: 0 0 0 rgba(34, 211, 238, 0); } 50% { box-shadow: 0 8px 28px rgba(34, 211, 238, .45); } }
    @keyframes boot-ping { 0% { transform: scale(.85); opacity: .7; } 100% { transform: scale(1.5); opacity: 0; } }
    @keyframes boot-spin { to { transform: rotate(360deg); } }
    @keyframes boot-slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
    @media (prefers-reduced-motion: reduce) { .boot *, .boot-logo::after { animation: none !important; } }
  </style>
</head>
<body>
  <div id="root">
    <div class="boot" role="status" aria-label="Loading Trade Guard">
      <div class="boot-logo"><i></i><i></i><img src="/icon.svg" alt=""></div>
      <div><b>Trade Guard</b><small>Trade by the rules</small></div>
      <div class="boot-bar"><span></span></div>
    </div>
  </div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
