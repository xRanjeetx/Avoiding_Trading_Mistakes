server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Same security headers as vercel.json (HSTS is left to the TLS terminator in front of this container).
  server_tokens off;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com 'sha256-EvnjTlhKGVCF3/yc+VkCfbdUwmgmMBn+DA69xHJBJq4=' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://*.onrender.com; worker-src 'self' blob:; frame-src https://challenges.cloudflare.com; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;

  location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    client_max_body_size 5m;
  }

  # The service worker must always be revalidated so updates reach users.
  # (A location with its own add_header drops the server-level ones, so nosniff is repeated in these two.)
  location = /sw.js {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
  }

  location / {
    try_files $uri /index.html;
  }
}
